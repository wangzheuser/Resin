services:
  resin:
    build:
      context: .
      dockerfile: Dockerfile
    # image: ghcr.io/resinat/resin:latest  # 注释掉官方镜像，使用本地构建
    container_name: resin
    restart: unless-stopped
    environment:
      RESIN_AUTH_VERSION: ${RESIN_AUTH_VERSION}
      RESIN_ADMIN_TOKEN: ${RESIN_ADMIN_TOKEN}
      RESIN_PROXY_TOKEN: ${RESIN_PROXY_TOKEN}
      RESIN_LISTEN_ADDRESS: 0.0.0.0
      RESIN_PORT: ${RESIN_PORT}
      # Keep probe pressure bounded for large node pools; override per host when needed.
      RESIN_PROBE_CONCURRENCY: ${RESIN_PROBE_CONCURRENCY:-16}
      RESIN_PROXY_CONNECT_IDLE_TIMEOUT: ${RESIN_PROXY_CONNECT_IDLE_TIMEOUT:-1m}
      RESIN_PROXY_CONNECT_MAX_LIFETIME: ${RESIN_PROXY_CONNECT_MAX_LIFETIME:-30m}
      RESIN_MAX_INBOUND_CONNECTIONS: ${RESIN_MAX_INBOUND_CONNECTIONS:-256}
      RESIN_PROXY_TRANSPORT_MAX_IDLE_CONNS: ${RESIN_PROXY_TRANSPORT_MAX_IDLE_CONNS:-128}
      RESIN_PROXY_TRANSPORT_MAX_IDLE_CONNS_PER_HOST: ${RESIN_PROXY_TRANSPORT_MAX_IDLE_CONNS_PER_HOST:-2}
      RESIN_PROXY_TRANSPORT_IDLE_CONN_TIMEOUT: ${RESIN_PROXY_TRANSPORT_IDLE_CONN_TIMEOUT:-30s}
      # These limits apply per node transport; cap retained node transports so
      # random account IDs cannot multiply the idle connection budget.
      RESIN_PROXY_TRANSPORT_MAX_NODES: ${RESIN_PROXY_TRANSPORT_MAX_NODES:-256}
      # 默认平台粘性会话 TTL，从 .env 读取；未设置时回退到 168h（与程序内置默认一致）
      RESIN_DEFAULT_PLATFORM_STICKY_TTL: ${RESIN_DEFAULT_PLATFORM_STICKY_TTL:-168h}
      # 请求日志库大小与保留个数（env-only，见 internal/config/env.go；未声明时 .env 中的值不会传入容器）
      RESIN_REQUEST_LOG_DB_MAX_MB: ${RESIN_REQUEST_LOG_DB_MAX_MB:-128}
      RESIN_REQUEST_LOG_DB_RETAIN_COUNT: ${RESIN_REQUEST_LOG_DB_RETAIN_COUNT:-5}
      TZ: ${TZ:-Asia/Shanghai}
    ports:
      - "${RESIN_PORT}:${RESIN_PORT}"
    volumes:
      - resin_cache:/var/cache/resin
      - resin_state:/var/lib/resin
      - resin_log:/var/log/resin
    healthcheck:
      # Container liveness must not flap when upstream proxy nodes are
      # temporarily unavailable. Readiness remains available at /readyz for
      # callers that need to gate traffic on healthy egress capacity.
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:${RESIN_PORT}/healthz >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  resin_cache:
  resin_state:
  resin_log:
