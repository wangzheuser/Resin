services:
  resin:
    build:
      context: .
      dockerfile: Dockerfile
    # image: ghcr.io/resinat/resin:latest  # 注释掉官方镜像，使用本地构建
    container_name: resin
    restart: unless-stopped
    environment:
      RESIN_AUTH_VERSION: ${RESIN_AUTH_VERSION}
      RESIN_ADMIN_TOKEN: ${RESIN_ADMIN_TOKEN}
      RESIN_PROXY_TOKEN: ${RESIN_PROXY_TOKEN}
      RESIN_LISTEN_ADDRESS: 0.0.0.0
      RESIN_PORT: ${RESIN_PORT}
      TZ: ${TZ:-Asia/Shanghai}
    ports:
      - "${RESIN_PORT}:${RESIN_PORT}"
    volumes:
      - resin_cache:/var/cache/resin
      - resin_state:/var/lib/resin
      - resin_log:/var/log/resin
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:${RESIN_PORT}/healthz >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  resin_cache:
  resin_state:
  resin_log:
